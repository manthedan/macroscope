<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Macroscope</title>
  <desc id="desc">Macroscope — developer environment archaeology for your Mac.</desc>
  <style>
    .wordmark { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif; font-weight: 760; letter-spacing: -0.045em; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif; font-weight: 500; letter-spacing: -0.01em; }
    .small { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 700; letter-spacing: 0.03em; }
    .ink { fill: #142033; }
    .muted { fill: #667085; }
    .panel { fill: #F8FAFC; stroke: #D8E0EA; }
    .line { stroke: #93A4B8; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #F4F7FB; }
      .muted { fill: #A8B4C4; }
      .panel { fill: #101826; stroke: #2B3A50; }
      .line { stroke: #52647B; }
    }
  </style>
  <defs>
    <linearGradient id="aqua" x1="118" y1="45" x2="244" y2="211" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4DE3FF"/>
      <stop offset="0.52" stop-color="#6D7CFF"/>
      <stop offset="1" stop-color="#B15CFF"/>
    </linearGradient>
    <linearGradient id="warm" x1="43" y1="32" x2="202" y2="241" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCF5A"/>
      <stop offset="0.55" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#B15CFF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1B2A41" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.27 0 0 0 0 0.58 0 0 0 0 1 0 0 0 0.35 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="42" y="32" width="206" height="206" rx="46" class="panel" stroke-width="2"/>
    <circle cx="92" cy="82" r="7" fill="#FF6159"/>
    <circle cx="116" cy="82" r="7" fill="#FFBD2E"/>
    <circle cx="140" cy="82" r="7" fill="#28C840"/>

    <path d="M75 128H210" class="line" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <path d="M75 159H210" class="line" stroke-width="3" stroke-linecap="round" opacity="0.28"/>
    <path d="M105 104V194" class="line" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
    <path d="M159 104V194" class="line" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

    <circle cx="142" cy="137" r="47" fill="url(#aqua)" opacity="0.96" filter="url(#glow)"/>
    <circle cx="142" cy="137" r="31" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="142" cy="137" r="47" stroke="#FFFFFF" stroke-width="5" opacity="0.72"/>
    <path d="M175 170L212 207" stroke="url(#warm)" stroke-width="16" stroke-linecap="round"/>
    <path d="M176 169L213 206" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    <path d="M123 132L137 147L166 116" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(302 79)">
    <text x="0" y="70" class="wordmark ink" font-size="82">Macroscope</text>
    <text x="4" y="118" class="tagline muted" font-size="27">Developer environment archaeology for your Mac.</text>
    <g transform="translate(6 148)">
      <rect x="0" y="0" width="122" height="34" rx="17" fill="#22C55E" opacity="0.13"/>
      <text x="20" y="23" class="small" font-size="14" fill="#16A34A">READ-ONLY</text>
      <rect x="138" y="0" width="116" height="34" rx="17" fill="#3B82F6" opacity="0.13"/>
      <text x="158" y="23" class="small" font-size="14" fill="#2563EB">EXPLAIN</text>
      <rect x="270" y="0" width="92" height="34" rx="17" fill="#A855F7" opacity="0.13"/>
      <text x="291" y="23" class="small" font-size="14" fill="#9333EA">PLAN</text>
      <rect x="378" y="0" width="104" height="34" rx="17" fill="#F97316" opacity="0.13"/>
      <text x="398" y="23" class="small" font-size="14" fill="#EA580C">GUIDE</text>
    </g>
  </g>
</svg>
