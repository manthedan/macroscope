[package]
name = "macroscope"
version = "0.2.0"
edition = "2024"
description = "A local-first macOS evidence and remediation engine for humans and AI agents"
license = "MIT"
repository = "https://github.com/manthedan/macroscope"
readme = "README.md"
keywords = ["macos", "audit", "cleanup", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
dirs = "6.0"
owo-colors = "4.2"
plist = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
